const day = (iso) => { const p = iso.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]) / 864e5; };
const fmt = (iso, withYear) => iso.slice(8, 10) + ' ' + MON[+iso.slice(5, 7) - 1] + (withYear ? ' ' + iso.slice(0, 4) : '');
const pc = (n) => (Math.round(n * 100) / 100) + '%';

class Component extends DCLogic {
  state = { view: 'timeline', year: '2026', kind: 'ALL', status: 'ALL', group: 'year', shown: 18 };
  PER = 18;

  // every row with the derived dates the two views need
  rows() {
    return DATA.map((r) => {
      const segs = r.segs || [[r.start, r.end || TODAY]];
      const last = r.end || segs[segs.length - 1][1];      // the date it files under
      return Object.assign({}, r, { segs, filed: last, endEff: r.end || TODAY, single: r.start === r.end });
    });
  }

  renderVals() {
    const st = this.state;
    const empty = !!this.props.emptyAccount;
    const busy = !!this.props.loading;
    const all = empty ? [] : this.rows();
    const isAll = st.year === 'ALL';

    // the window the page is looking at
    const years = Array.from(new Set(all.map((r) => r.filed.slice(0, 4)))).sort().reverse();
    const firstYear = all.length ? Math.min.apply(null, all.map((r) => +r.start.slice(0, 4))) : 2026;
    const y0 = isAll ? firstYear : +st.year, y1 = isAll ? +TODAY.slice(0, 4) : +st.year;
    const w0 = day(y0 + '-01-01'), w1 = day((y1 + 1) + '-01-01');
    const filedIn = (r) => isAll || r.filed.slice(0, 4) === st.year;        // a title files under the year it ended, or was last touched
    const inScope = filedIn;
    const inKind = (r) => st.kind === 'ALL' || r.k === st.kind;
    const inStatus = (r) => st.status === 'ALL' || r.st === st.status;

    const scoped = all.filter(inScope);
    const byStatus = scoped.filter(inStatus);
    const filtered = byStatus.filter(inKind).sort((a, b) => (a.filed < b.filed ? 1 : -1));
    const scope = isAll ? 'ALL TIME' : st.year;

    // grid
    const shown = filtered.slice(0, st.shown);
    const groups = [];
    shown.forEach((r) => {
      const key = st.group === 'year' ? r.filed.slice(0, 4) : r.filed.slice(0, 7);
      const label = st.group === 'year' ? key : MONTHS[+r.filed.slice(5, 7) - 1] + (isAll ? ' ' + r.filed.slice(0, 4) : '');
      let g = groups.find((x) => x.key === key);
      if (!g) groups.push(g = { key, label, meta: '', rows: [] });
      const wy = r.start.slice(0, 4) !== r.filed.slice(0, 4) || isAll;
      const days = Math.round(day(r.endEff) - day(r.start)) + 1;
      const range = r.single ? fmt(r.start, isAll)
        : (r.end ? fmt(r.start, wy) + ' → ' + fmt(r.end, wy) : 'SINCE ' + fmt(r.start, wy)) + ' · ' + days + ' DAYS';
      g.rows.push({
        title: r.t, kind: r.k, dot: DOT[r.k], art: ARTS[r.a],
        stLabel: ST[r.st].label, stFg: ST[r.st].fg, range,
        hasScore: !!r.score, score: r.score,
      });
    });
    groups.forEach((g) => { g.meta = g.rows.length + (g.rows.length === 1 ? ' TITLE' : ' TITLES'); });

    const kindRows = scoped.filter(inStatus);
    const filteredOut = scoped.length > 0 && filtered.length === 0;
    const sel = filtered;
    return {
      emptyAccount: empty, busy,
      scopeLabel: empty ? 'NOTHING TRACKED YET' : scope + ' · ' + filtered.length + (filtered.length === 1 ? ' TITLE' : ' TITLES'),
      views: [['timeline', 'TIMELINE', '▬'], ['grid', 'GRID', '▦']].map((v) => ({
        label: v[1], glyph: v[2], on: st.view === v[0],
        bg: st.view === v[0] ? '#f0edf4' : 'transparent',
        fg: st.view === v[0] ? '#14101a' : '#b8b1c4',
        pick: () => this.setState({ view: v[0] }),
      })),
      isGrid: st.view === 'grid',
      showGrid: st.view === 'grid' && filtered.length > 0,
      showTimeline: st.view === 'timeline' && all.some((r) => inKind(r) && inStatus(r)),

      // kind strip: ALL is always spelled out; the six kinds are dots that open into name + count. Picking the open one again clears it.
      kindChips: [{ key: 'ALL', label: 'ALL' }].concat(KINDS).map((k) => {
        const key = k.key, all = key === 'ALL', on = st.kind === key, c = k.dot;
        const count = all ? kindRows.length : kindRows.filter((r) => r.k === key).length;
        return {
          label: k.label, count, on, aria: k.label + ' · ' + count,
          dot: c || 'transparent', dotDisplay: all ? 'none' : 'block', lcls: all ? '' : 'kl',
          bg: on ? (all ? 'rgba(255,255,255,0.1)' : c + '2b') : '', ring: on ? 'inset 0 0 0 1px ' + (all ? 'rgba(255,255,255,0.22)' : c + '99') : 'none',
          op: count || on || all ? 1 : 0.4,
          pick: () => this.setState({ kind: on ? 'ALL' : key, shown: this.PER }),
        };
      }),
      year: st.year,
      yearOpts: years.map((y) => ({ v: y, label: y })).concat([{ v: 'ALL', label: 'ALL TIME' }]),
      onYear: (e) => this.setState({ year: e.target.value, shown: this.PER }),
      status: st.status,
      onStatus: (e) => this.setState({ status: e.target.value, shown: this.PER }),
      group: st.group,
      onGroup: (e) => this.setState({ group: e.target.value }),

      stats: [
        { v: sel.filter((r) => r.st === 'completed').length, k: 'COMPLETED' },
        { v: sel.length, k: 'TITLES' },
        { v: sel.reduce((n, r) => n + r.ep, 0), k: 'EPISODES' },
        { v: sel.reduce((n, r) => n + r.ch, 0), k: 'CHAPTERS' },
      ].map((s, i) => ({ v: String(s.v), k: s.k, rule: i === 0 ? 'none' : 'inset 1px 0 0 rgba(255,255,255,0.09)' })),

      listOpacity: busy ? 0.45 : 1,
      busyLabel: 'LOADING ' + scope + '…',

      kind: st.kind,

      groups,
      moreDisplay: st.view === 'grid' && filtered.length > shown.length ? 'flex' : 'none',
      loadMore: () => this.setState({ shown: st.shown + this.PER }),

      isEmpty: st.view === 'grid' ? filtered.length === 0 : !all.some((r) => inKind(r) && inStatus(r)),
      filteredOut,
      emptyTitle: empty ? 'Nothing yet' : (filteredOut ? 'No matches' : 'Nothing in ' + scope),
      emptyBody: empty
        ? 'Check in to something and it lands here: every title, with the dates you started and finished it.'
        : (filteredOut
          ? 'Nothing in ' + scope + ' matches this kind and status. Clear one of them to widen the view.'
          : 'You have history, just not in this window. Pick another year above.'),
      emptyAction: () => this.setState({ kind: 'ALL', status: 'ALL', shown: this.PER }),
    };
  }
}
