<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0e0c10; color: #f0edf4; font-family: Archivo, sans-serif; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: #d96bb0; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
    :focus-visible { outline: 2px solid #d96bb0; outline-offset: 2px; }
    input::placeholder { color: #948da1; }
    .field { background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); border-radius: 12px; display: flex; align-items: center; transition: box-shadow 140ms ease; }
    .field:focus-within { box-shadow: inset 0 0 0 1px #d96bb0, 0 0 0 4px rgba(217,107,176,0.16); }
    .field input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #f0edf4; font-family: Archivo, sans-serif; font-size: 16px; padding: 15px 18px; }
    @keyframes wall-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes wall-down { from { transform: translateY(-50%); } to { transform: translateY(0); } }
    .wall-col { display: flex; flex-direction: column; will-change: transform; }
    .wall-up { animation: wall-up 52s linear infinite; }
    .wall-down { animation: wall-down 64s linear infinite; }
    .wall-up.slow { animation-duration: 76s; }
    @media (prefers-reduced-motion: reduce) { .wall-up, .wall-down { animation: none; } }
  </style>
</helmet>

<div style="min-height: 100vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr));">

  <!-- LEFT — the form, and nothing else competing with it -->
  <div style="position: relative; display: flex; flex-direction: column; padding: 28px clamp(24px, 5vw, 64px) 32px; min-width: 0;">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(520px 380px at 0% 0%, rgba(139,92,246,0.28), transparent 70%), radial-gradient(520px 420px at 20% 110%, rgba(217,164,65,0.22), transparent 70%); pointer-events: none;"></div>
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: url('noise.svg'); background-size: 220px; opacity: 0.5; mix-blend-mode: overlay; pointer-events: none;"></div>

    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Landing.dc.html" style="font-family: Anton; font-size: 26px; letter-spacing: 0.02em; background: linear-gradient(90deg, #d9a441, #d96bb0, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent;">TRACKT</a>
      <a href="Landing.dc.html" style="font-family: 'Space Grotesk'; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #b8b1c4;">← BACK TO SITE</a>
    </div>

    <main style="position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; width: 100%; max-width: 420px; margin: 0 auto; padding: 48px 0;">
      <h1 style="margin: 0; font-family: Anton; font-weight: 400; font-size: 56px; line-height: 0.95; text-transform: uppercase;">{{ heading }}</h1>

      <!-- one form, two modes -->
      <div style="display: flex; box-shadow: inset 0 -1px 0 rgba(255,255,255,0.12);">
        <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
          <button onClick="{{ m.pick }}" aria-pressed="{{ m.on }}" style="position: relative; padding: 13px 16px 13px 0; margin-right: 20px; font-family: 'Space Grotesk'; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{ m.fg }};" style-hover="color: #f0edf4;">
            <span>{{ m.label }}</span>
            <span aria-hidden="true" style="position: absolute; left: 0; right: 16px; bottom: 0; height: 2px; border-radius: 2px; background: {{ m.line }};"></span>
          </button>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px;">
        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
          <label style="display: flex; flex-direction: column; gap: 7px;">
            <span style="font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #b8b1c4;">USERNAME</span>
            <span class="field"><input type="text" autocomplete="username" placeholder="marav"></span>
          </label>
        </sc-if>
        <label style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #b8b1c4;">EMAIL</span>
          <span class="field"><input type="email" autocomplete="email" placeholder="you@example.com"></span>
        </label>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label for="pw" style="font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #b8b1c4;">PASSWORD</label>
            <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
              <a href="Login.dc.html" style="font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #d96bb0;">FORGOT?</a>
            </sc-if>
          </div>
          <span class="field">
            <input id="pw" type="{{ pwType }}" autocomplete="current-password" placeholder="{{ pwHint }}">
            <button onClick="{{ togglePw }}" aria-pressed="{{ pwShown }}" style="font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #b8b1c4; padding: 15px 16px;" style-hover="color: #d96bb0;">{{ pwToggle }}</button>
          </span>
        </div>
      </div>

      <a href="{{ submitHref }}" style="background: linear-gradient(90deg, #d9a441, #d96bb0, #8b5cf6); color: #14101a; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; padding: 17px 24px; border-radius: 999px; text-align: center;" style-hover="filter: brightness(1.15); color: #14101a;">{{ submit }}</a>

      <div style="color: #b8b1c4; font-size: 14px; line-height: 1.5;">{{ switchText }} <button onClick="{{ switchMode }}" style="color: #d96bb0; font-weight: 700;">{{ switchAction }}</button></div>
    </main>

    <div style="position: relative; display: flex; gap: 8px 20px; flex-wrap: wrap; font-family: 'Space Grotesk'; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #948da1;">
      <a href="https://github.com/pvrnn/Trackt" style="color: #b8b1c4;">OPEN SOURCE ON GITHUB ↗</a>
      <span>TV TIME IMPORT COMING SOON</span>
    </div>
  </div>

  <!-- RIGHT — what's waiting on the other side -->
  <div aria-hidden="true" style="position: relative; overflow: hidden; min-height: 420px; background: #0b090d; box-shadow: inset 1px 0 0 rgba(255,255,255,0.09);">
    <div style="position: absolute; inset: -160px -60px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; transform: rotate(-7deg);">
      <sc-for list="{{ wall }}" as="col" hint-placeholder-count="3">
        <div class="{{ col.cls }}">
          <sc-for list="{{ col.items }}" as="c" hint-placeholder-count="6">
            <div style="aspect-ratio: 2/3; margin-bottom: 16px; border-radius: 12px; background: {{ c.art }}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 18px 40px -20px rgba(0,0,0,0.9); position: relative;">
              <div style="position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: #14101a;">
                <span style="width: 6px; height: 6px; border-radius: 999px; background: {{ c.dot }};"></span>
                <span style="font-family: 'Space Grotesk'; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: #f0edf4;">{{ c.kind }}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <!-- scrim: the statement never sits on raw artwork -->
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,9,13,0.55) 0%, rgba(11,9,13,0.15) 30%, rgba(11,9,13,0.6) 46%, rgba(11,9,13,0.94) 68%, #0b090d 100%);"></div>
    <div style="position: absolute; left: clamp(24px, 4vw, 56px); right: clamp(24px, 4vw, 56px); bottom: clamp(28px, 5vw, 56px); display: flex; flex-direction: column; gap: 18px;">
      <div style="font-family: Anton; font-size: clamp(44px, 5vw, 72px); line-height: 0.94; text-transform: uppercase;">{{ pitchA }}<br><span style="background-image: linear-gradient(90deg, #d9a441, #d96bb0, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent;">{{ pitchB }}</span></div>
      <div style="display: flex; gap: 8px 16px; flex-wrap: wrap;">
        <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 7px;">
            <span style="width: 7px; height: 7px; border-radius: 999px; background: {{ k.dot }};"></span>
            <span style="font-family: 'Space Grotesk'; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #cfc9d8;">{{ k.label }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const ARTS = [
  'radial-gradient(90% 60% at 70% 18%, #7c6cf0 0%, transparent 62%), linear-gradient(165deg, #35296b 0%, #0e0c1a 100%)',
  'radial-gradient(80% 50% at 30% 28%, #ffd98a 0%, transparent 66%), linear-gradient(170deg, #c9742a 0%, #3a1a0a 100%)',
  'repeating-linear-gradient(0deg, rgba(255,255,255,0.10) 0 2px, transparent 2px 7px), linear-gradient(160deg, #3a55b0 0%, #080b17 100%)',
  'radial-gradient(70% 45% at 60% 30%, #fff3fa 0%, transparent 70%), linear-gradient(180deg, #f7a8d2 0%, #b84a8c 100%)',
  'linear-gradient(118deg, transparent 0 56%, #c8242b 56% 68%, transparent 68%), linear-gradient(180deg, #f4f0e6 0%, #d8d2c4 100%)',
  'radial-gradient(60% 40% at 50% 38%, #fff7c2 0%, transparent 70%), linear-gradient(180deg, #f2c81e 0%, #e0a80c 100%)',
  'linear-gradient(180deg, #d6eefa 0%, #7dbbe0 48%, #1d4f7a 100%)',
  'radial-gradient(46% 32% at 50% 40%, #e9e4f5 0%, transparent 72%), linear-gradient(180deg, #55309a 0%, #0d0817 100%)',
  'linear-gradient(64deg, transparent 0 44%, rgba(255,255,255,0.85) 44% 47%, transparent 47%), linear-gradient(200deg, #c2202a 0%, #2a0608 78%)',
  'radial-gradient(70% 50% at 40% 62%, #ff9bd0 0%, transparent 70%), linear-gradient(180deg, #1b3a2a 0%, #0a1510 100%)',
  'linear-gradient(180deg, #ece6d6 0%, #b9ae95 58%, #5a5140 100%)',
  'conic-gradient(from 200deg at 62% 38%, #ff7a59, #ffd23f, #35d6c0, #8b5cf6, #ff7a59)',
];
const KINDS = [
  { key: 'MOVIE', label: 'MOVIES', dot: '#8b5cf6' },
  { key: 'SERIES', label: 'SERIES', dot: '#6d8bf0' },
  { key: 'ANIME', label: 'ANIME', dot: '#d9a441' },
  { key: 'MANGA', label: 'MANGA', dot: '#e8874a' },
  { key: 'WEBTOON', label: 'WEBTOONS', dot: '#d96bb0' },
  { key: 'GAME', label: 'GAMES', dot: '#3fbf8f' },
];
const DOT = KINDS.reduce((m, k) => { m[k.key] = k.dot; return m; }, {});
const WALL = [
  [[5, 'ANIME'], [0, 'SERIES'], [11, 'GAME'], [4, 'MANGA'], [2, 'MOVIE']],
  [[8, 'MANGA'], [3, 'WEBTOON'], [1, 'ANIME'], [6, 'SERIES'], [7, 'MOVIE']],
  [[10, 'SERIES'], [9, 'ANIME'], [4, 'MANGA'], [11, 'GAME'], [3, 'WEBTOON']],
];

class Component extends DCLogic {
  state = { mode: 'login', pwShown: false };

  renderVals() {
    const login = this.state.mode === 'login';
    const prism = 'linear-gradient(90deg, #d9a441, #d96bb0, #8b5cf6)';
    return {
      isLogin: login,
      isRegister: !login,
      heading: login ? 'Welcome back' : 'Start your log',
      modes: [['login', 'SIGN IN'], ['register', 'CREATE ACCOUNT']].map((m) => ({
        label: m[1], on: this.state.mode === m[0],
        fg: this.state.mode === m[0] ? '#f0edf4' : '#b8b1c4',
        line: this.state.mode === m[0] ? prism : 'transparent',
        pick: () => this.setState({ mode: m[0] }),
      })),
      pwType: this.state.pwShown ? 'text' : 'password',
      pwShown: this.state.pwShown,
      pwToggle: this.state.pwShown ? 'HIDE' : 'SHOW',
      pwHint: login ? 'Your password' : 'Choose a password',
      togglePw: () => this.setState((s) => ({ pwShown: !s.pwShown })),
      submit: login ? 'SIGN IN' : 'CREATE ACCOUNT — FREE',
      submitHref: login ? 'Home.dc.html' : 'Onboarding.dc.html',
      switchText: login ? 'New here?' : 'Already tracking?',
      switchAction: login ? 'Create an account' : 'Sign in',
      switchMode: () => this.setState({ mode: login ? 'register' : 'login' }),

      pitchA: login ? 'Pick up where' : 'Everything you watch,',
      pitchB: login ? 'you left off.' : 'read and play.',
      kinds: KINDS.map((k) => ({ label: k.label, dot: k.dot })),
      wall: WALL.map((col, n) => {
        const items = col.map((c) => ({ art: ARTS[c[0]], kind: c[1], dot: DOT[c[1]] }));
        return { cls: 'wall-col ' + (n === 1 ? 'wall-down' : (n === 2 ? 'wall-up slow' : 'wall-up')), items: items.concat(items) };
      }),
    };
  }
}
</script>
</body>
</html>
