packages:
  - apps/*
  - packages/*

# Peers are declared, never guessed. With pnpm's default auto-install, a peer
# range like @trackt/client's `react` resolves to whatever is newest and lands
# a *second* copy of React inside the package — which Metro then bundles
# alongside apps/mobile's, and expo-doctor rightly fails on ("duplicate native
# module dependencies").
autoInstallPeers: false

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  unrs-resolver: false

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - unrs-resolver

# Single ioredis instance across the workspace (bullmq pins an older one).
overrides:
  ioredis: ^5.11.1

# `@react-native-community/datetimepicker`'s config plugin requires
# `@expo/config-plugins` without declaring it — it assumes a hoisted layout.
# Under pnpm's isolated one it cannot resolve, and `expo config` (so
# `expo-doctor`, so CI) dies before it reads the app config at all.
packageExtensions:
  '@react-native-community/datetimepicker':
    dependencies:
      '@expo/config-plugins': '^57.0.8'

# pnpm 11 holds freshly published versions back by default; `expo install` picks
# the version the SDK expects, so the SDK's own packages are exempted by name.
minimumReleaseAgeExclude:
  - expo-image-picker@57.0.11
  - '@expo/cli@57.0.16'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14
  - '@expo/metro-runtime@57.0.11'
  - expo-router@57.0.14
